metadata:
  name: lance-vector-similarity-search
  version: 2.0.0
  description: Demonstrates Lance vector similarity search with lance_knn table function
  author: Skardi Demo
  created_at: 2025-01-24T00:00:00.000+00:00
  updated_at: 2025-01-30T00:00:00.000+00:00

# This pipeline demonstrates vector similarity search using the lance_knn table function.
# The query finds items similar to a given reference item based on vector embeddings.
#
# WHERE clause filters are pushed down to Lance for efficient metadata filtering.
#
# Query Pattern:
#   1. Use lance_knn table function with:
#      - table_name: Name of the Lance table
#      - vector_column: Name of the embedding column
#      - query_vector: Subquery that returns the reference vector
#      - k: Number of nearest neighbors to retrieve from the ANN index
#
#   2. WHERE clause filters (pushed down to Lance):
#      - Exclude the reference item itself
#      - Optional min/max revenue filters
#
# Parameters:
#   {reference_id}: ID of the reference item to find similar items for
#   {min_revenue}: Optional minimum revenue filter (null = no filter)
#   {max_revenue}: Optional maximum revenue filter (null = no filter)

query: |
  SELECT
    knn.id,
    knn.item_id,
    knn.revenue,
    knn._distance as distance
  FROM lance_knn(
    'sift_items',
    'vector',
    (SELECT vector FROM sift_items WHERE id = {reference_id}),
    50
  ) knn
  WHERE knn.id != {reference_id}
    AND ({min_revenue} IS NULL OR knn.revenue >= {min_revenue})
    AND ({max_revenue} IS NULL OR knn.revenue <= {max_revenue})

# Example API Calls:
#
# Basic search (no revenue filter):
# POST /lance-vector-similarity-search/execute
# {
#   "reference_id": 1,
#   "min_revenue": null,
#   "max_revenue": null
# }
#
# Filtered search:
# POST /lance-vector-similarity-search/execute
# {
#   "reference_id": 1,
#   "min_revenue": 1000.0,
#   "max_revenue": 5000.0
# }
#
# Response:
# {
#   "data": [
#     {
#       "id": 42,
#       "item_id": 1337,
#       "revenue": 2500.50,
#       "distance": 0.125
#     },
#     ...
#   ],
#   "rows_affected": 10,
#   "execution_time_ms": 15
# }
