metadata:
  name: "ingest-text"
  version: "1.0.0"
  description: >
    Ingest pre-tokenized text into MongoDB for full-text search.
    In production, the caller (e.g. FastGPT) runs Jieba tokenization
    before calling this endpoint.

# Parameters:
#   {doc_id}        - Unique document ID (matches the pgvector document)
#   {full_text_token} - Space-separated tokenized text (e.g. Jieba output)

query: |
  INSERT INTO document_texts ("doc_id", "fullTextToken")
  VALUES ({doc_id}, {full_text_token})
