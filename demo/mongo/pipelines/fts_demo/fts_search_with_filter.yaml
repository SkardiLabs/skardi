metadata:
  name: "fts-search-with-filter"
  version: "1.0.0"
  description: >
    Full-text search filtered by teamId.
    Combines $text search with field-level filter pushdown to MongoDB.

# Parameters:
#   {query}   - Search terms
#   {team_id} - Team ID to filter by
#   {limit}   - Maximum number of results to return

query: |
  SELECT "dataId", "teamId", "datasetId", "collectionId", "fullTextToken", _score
  FROM mongo_fts('dataset_data_texts', {query}, {limit})
  WHERE "teamId" = {team_id}
  ORDER BY _score DESC
