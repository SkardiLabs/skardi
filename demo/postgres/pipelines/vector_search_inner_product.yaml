metadata:
  name: "vector-search-inner-product"
  version: "1.0.0"
  description: >
    KNN similarity search using negative inner product (<#>).
    Finds the k documents most similar to the document identified by seed_id.
    Score is negative — lower (more negative) means more similar.

# Parameters:
#   {seed_id} - ID of the document whose embedding is used as the query vector
#   {k}       - number of nearest neighbours to retrieve

query: |
  SELECT id, content, metadata, _score
  FROM pg_knn('documents', 'embedding',
      (SELECT embedding FROM documents WHERE id = {seed_id}),
      '<#>', {k})
  ORDER BY _score
