metadata:
  name: semantic-search
  version: 1.0.0
  description: >
    Semantic search over a knowledge-base using local BERT embeddings.
    The candle() UDF embeds the user query on the fly; lance_knn() finds
    the nearest documents by cosine similarity.
  author: Skardi Demo

# Parameters:
#   {query} - Natural language search query (embedded on the fly)
#   {k}     - Number of nearest neighbours to return

query: |
  SELECT id, title, content, _distance
  FROM lance_knn(
    'doc_embeddings',
    'embedding',
    candle('models/generated/bge-small-en-v1.5', {query}),
    {k}
  )
  ORDER BY _distance
