data_sources:
  - name: wiki
    type: sqlite
    path: demo/llm_wiki/wiki.db
    access_mode: read_write
    hierarchy_level: catalog
    options:
      extensions_env: SQLITE_VEC_PATH

# Pipelines the `skardi run` (and alias) subcommand discovers. Relative paths
# resolve against this ctx file's directory, so the same config works whether
# invoked from the repo root or from inside demo/llm_wiki/.
pipelines_dir: pipelines-cli
