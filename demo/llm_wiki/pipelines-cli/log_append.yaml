metadata:
  name: "wiki-log-append"
  version: "1.0.0"
  description: "Append an activity entry to wiki_log (agent `log` primitive)."

# Parameters:
#   {event_type}  - ingest | query | lint | note
#   {slug}        - Related page slug, or "" if not page-specific
#   {message}     - Free-form human-readable message

query: |
  INSERT INTO wiki.main.wiki_log (event_type, slug, message)
  SELECT event_type, slug, message
  FROM (
    SELECT {event_type} AS event_type, {slug} AS slug, {message} AS message
  ) AS t
