kind: pipeline

metadata:
  name: "wiki-list"
  version: "1.0.0"
  description: >
    List wiki pages filtered by page_type and slug prefix, newest first.
    Both filters accept SQL LIKE patterns — pass "%" to match everything.

# Parameters:
#   {page_type_pattern}  - SQL LIKE pattern for page_type (e.g. 'entity', '%')
#   {slug_prefix}        - SQL LIKE pattern for slug (e.g. 'concept/%', '%')
#   {limit}              - Maximum number of pages to return

spec:
  query: |
    SELECT slug, title, page_type, updated_at
    FROM wiki.main.wiki_pages
    WHERE page_type LIKE {page_type_pattern}
      AND slug      LIKE {slug_prefix}
    ORDER BY updated_at DESC
    LIMIT {limit}
