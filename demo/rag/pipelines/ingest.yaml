metadata:
  name: "ingest"
  version: "1.0.0"
  description: >
    Ingest a document into the RAG pipeline. Embeds text with candle (bge-small-en-v1.5)
    and inserts the vector into PostgreSQL (pgvector) for semantic search.

# Parameters:
#   {doc_id}  - Unique document ID
#   {content} - Document text content

query: |
  INSERT INTO documents (id, content, embedding)
  VALUES (
    {doc_id},
    {content},
    candle('models/generated/bge-small-en-v1.5', {content})
  )
