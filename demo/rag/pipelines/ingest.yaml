metadata:
  name: "ingest"
  version: "1.0.0"
  description: >
    Ingest a document into the RAG pipeline. A single INSERT writes both the
    raw content (searchable via pg_fts) and the candle-generated embedding
    (searchable via pg_knn) into the same Postgres row — no second write needed.

# Parameters:
#   {doc_id}  - Unique document ID
#   {content} - Document text (used for both FTS and vector embedding)

query: |
  INSERT INTO documents (id, content, embedding)
  VALUES (
    {doc_id},
    {content},
    candle('models/generated/bge-small-en-v1.5', {content})
  )
