metadata:
  name: "sqlite-knn-search-by-seed"
  version: "1.0.0"
  description: >
    Find items similar to an existing item by its ID.
    Uses a scalar subquery to fetch the seed item's embedding from the vec0
    table, then searches for the nearest neighbours.

# Parameters:
#   {seed_id} - ID of the item whose embedding is used as the query vector
#   {k}       - Number of nearest neighbours to return

query: |
  SELECT i.id, i.name, i.category, knn._score
  FROM sqlite_knn(
    'vec_items',
    'embedding',
    (SELECT embedding FROM vec_items WHERE item_id = {seed_id}),
    {k}
  ) knn
  JOIN items i ON i.id = knn.item_id
  ORDER BY knn._score
