metadata:
  name: "sqlite-knn-search"
  version: "1.0.0"
  description: >
    Semantic KNN search on a SQLite vec0 virtual table.
    Uses the candle() UDF to embed the query text on the fly with a local
    BERT model, then sqlite_knn() finds the nearest vectors.
    Lower _score means more similar.

# Parameters:
#   {query} - Natural language search query (embedded on the fly)
#   {k}     - Number of nearest neighbours to return

# Requires: --features candle
# Model: BAAI/bge-small-en-v1.5 (384 dims) — download with setup.py

query: |
  SELECT item_id, _score
  FROM sqlite_knn(
    'vec_items',
    'embedding',
    candle('models/generated/bge-small-en-v1.5', {query}),
    {k}
  )
