metadata:
  name: "sqlite-knn-search-with-join"
  version: "1.0.0"
  description: >
    Semantic KNN search joined with the data table for full item details.
    Embeds the query text on the fly with candle(), searches the vec0 index,
    then JOINs with the items table.

# Parameters:
#   {query} - Natural language search query
#   {k}     - Number of nearest neighbours to return

# Requires: --features candle

query: |
  SELECT i.id, i.name, i.category, knn._score
  FROM sqlite_knn(
    'vec_items',
    'embedding',
    candle('models/generated/bge-small-en-v1.5', {query}),
    {k}
  ) knn
  JOIN items i ON i.id = knn.item_id
  ORDER BY knn._score
