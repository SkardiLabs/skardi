metadata:
  name: "ingest"
  version: "1.0.0"
  description: >
    Ingest a document into Postgres. A single INSERT writes both the raw
    `content` (searchable via pg_fts once the GIN index is in place) and the
    candle-generated embedding (searchable via pg_knn). Identical to the
    rag-demo ingest — already pg_fts-ready.

# Parameters:
#   {doc_id}  - Unique document ID
#   {content} - Document text (used for both FTS and vector embedding)

query: |
  INSERT INTO documents (id, content, embedding)
  VALUES (
    {doc_id},
    {content},
    candle('models/generated/bge-small-en-v1.5', {content})
  )
