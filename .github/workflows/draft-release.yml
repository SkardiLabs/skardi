name: Draft Release
run-name: "Draft Release (${{ inputs.bump }} bump)"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      merge_timeout_minutes:
        # The job is capped at 360 minutes on GitHub-hosted runners, so the
        # wait has to leave room for the steps around it.
        description: "Minutes to wait for the bump PR to be merged (max 330)"
        required: false
        type: number
        default: 180

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Calculate next version and rc number
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the latest official (non-rc) release
          LATEST=$(gh release list --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease == false)] | .[0].tagName // empty' 2>/dev/null || true)

          if [ -z "$LATEST" ]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            VERSION="${LATEST#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
          fi

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEXT="${MAJOR}.${MINOR}.${PATCH}"

          # Count existing rc tags for this version to determine next rc number
          RC_COUNT=$(gh release list --json tagName --jq "[.[] | select(.tagName | startswith(\"v${NEXT}-rc.\"))] | length" 2>/dev/null || echo "0")
          RC_NUM=$((RC_COUNT + 1))

          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "rc=$RC_NUM" >> $GITHUB_OUTPUT
          echo "Next version: v${NEXT}-rc.${RC_NUM}"

      - name: Install Rust
        # Version comes from rust-toolchain.toml.
        run: rustup toolchain install

      - name: Bump version in Cargo.toml and open PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          RC="${{ steps.version.outputs.rc }}"
          FULL_VERSION="${NEXT}-rc.${RC}"
          BRANCH="release/bump-${FULL_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Set workspace.package.version and skardi's exact pin on
          # skardi-source-pack (the two are published to crates.io together).
          ./scripts/bump_version.sh "${FULL_VERSION}"
          cargo update -p skardi --precise "${FULL_VERSION}"

          # Main already carries this version: the bump PR from an earlier run
          # was merged after that run stopped waiting for it. There is nothing
          # to commit, so skip the PR and the wait and go straight to tagging
          # and drafting the release.
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "already_bumped=true" >> $GITHUB_OUTPUT
            echo "::notice::main is already at ${FULL_VERSION}; skipping the bump PR and resuming at the tag."
            exit 0
          fi
          echo "already_bumped=false" >> $GITHUB_OUTPUT

          # Clean up any leftover remote branch from a previous run
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"

          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${FULL_VERSION}"
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore: bump version to ${FULL_VERSION}" \
            --body "Automated version bump to \`${FULL_VERSION}\` ahead of the \`v${FULL_VERSION}\` release." \
            --base main \
            --head "$BRANCH")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "PR created: $PR_URL"

      - name: Wait for PR to be merged
        id: wait
        if: steps.pr.outputs.already_bumped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMEOUT_MINUTES: ${{ inputs.merge_timeout_minutes }}
        run: |
          PR_URL="${{ steps.pr.outputs.pr_url }}"

          case "$TIMEOUT_MINUTES" in
            ''|*[!0-9]*) echo "Error: merge_timeout_minutes must be a whole number, got '$TIMEOUT_MINUTES'."; exit 1 ;;
          esac
          if [ "$TIMEOUT_MINUTES" -lt 1 ] || [ "$TIMEOUT_MINUTES" -gt 330 ]; then
            echo "Error: merge_timeout_minutes must be between 1 and 330, got $TIMEOUT_MINUTES."
            exit 1
          fi

          TIMEOUT=$((TIMEOUT_MINUTES * 60))
          INTERVAL=30    # poll every 30 seconds
          ELAPSED=0

          echo "Waiting up to ${TIMEOUT_MINUTES} minutes for PR to be merged: $PR_URL"

          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATE=$(gh pr view "$PR_URL" --json state,mergeStateStatus --jq '.state')

            if [ "$STATE" = "MERGED" ]; then
              echo "PR merged successfully."
              break
            elif [ "$STATE" = "CLOSED" ]; then
              echo "Error: PR was closed without merging."
              exit 1
            fi

            echo "PR state: $STATE — waiting ${INTERVAL}s (elapsed: ${ELAPSED}s / ${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "Error: Timed out after ${TIMEOUT}s waiting for PR to be merged."
            echo "Merge the PR, then run this workflow again with the same bump: it finds main already bumped and resumes at the tag."
            exit 1
          fi

      - name: Fetch merged main and create RC tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

          FULL_VERSION="${{ steps.version.outputs.next }}-rc.${{ steps.version.outputs.rc }}"
          VERSION="v${FULL_VERSION}"

          # An earlier run (or a manual repair) may have pushed the tag already.
          # The release then goes on the commit that tag names, which need not
          # be main HEAD; `^{commit}` peels an annotated tag to that commit.
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            git fetch --force origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
            TARGET=$(git rev-parse "${VERSION}^{commit}")
            TAG_EXISTS=true
          else
            TARGET=$(git rev-parse HEAD)
            TAG_EXISTS=false
          fi

          # Never release a commit that does not carry the version being released.
          MANIFEST=$(git show "${TARGET}:Cargo.toml")
          if ! grep -q "^version = \"${FULL_VERSION}\"$" <<< "$MANIFEST"; then
            if [ "$TAG_EXISTS" = true ]; then
              echo "Error: $VERSION already exists at $TARGET, whose Cargo.toml is not at ${FULL_VERSION}; refusing to release it."
            else
              echo "Error: main's Cargo.toml is not at ${FULL_VERSION}; refusing to tag."
            fi
            exit 1
          fi

          if [ "$TAG_EXISTS" = true ]; then
            echo "Tag $VERSION already exists on origin at $TARGET; skipping."
            exit 0
          fi

          git tag "$VERSION"
          git push origin "$VERSION"
          echo "Tagged: $VERSION"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.next }}-rc.${{ steps.version.outputs.rc }}"
          gh release create "$VERSION" \
            --draft \
            --prerelease \
            --title "$VERSION" \
            --generate-notes
