name: Dev Docker Build

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image tag to publish (e.g. my-feature, test-pg-vector)"
        required: true
        type: string
      features:
        description: "Cargo features to enable (e.g. onnx), leave empty for default"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  docker:
    name: "Build and push :${{ inputs.image_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            FEATURES=${{ inputs.features }}
          provenance: false
          tags: ghcr.io/skardilabs/skardi/skardi-server:${{ inputs.image_name }}
          cache-from: type=gha,scope=dev-${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=dev-${{ inputs.image_name }}

      - name: Summary
        run: |
          echo "### Docker image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/skardilabs/skardi/skardi-server:${{ inputs.image_name }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
