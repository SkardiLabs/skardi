kind: pipeline

metadata:
  name: "sqlite-knn-insert-item"
  version: "1.0.0"
  description: >
    Insert a new item into the data table.
    The vec0 index must be updated separately (see knn_insert_vector).

# Parameters:
#   {id}       - Item ID (must match the item_id used in the vec0 table)
#   {name}     - Item name
#   {category} - Item category

spec:
  query: |
    INSERT INTO items (id, name, category)
    VALUES ({id}, {name}, {category})
