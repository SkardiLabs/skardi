kind: pipeline

metadata:
  name: "sqlite-fts-search-with-filter"
  version: "1.0.0"
  description: >
    Full-text search filtered by category.
    Combines BM25 scoring with WHERE clause filter pushdown to SQLite.

# Parameters:
#   {query}    - Search terms
#   {category} - Category to filter by
#   {limit}    - Maximum number of results to return

spec:
  query: |
    SELECT title, body, category, _score
    FROM sqlite_fts('articles_fts', 'body', {query}, {limit})
    WHERE category = {category}
    ORDER BY _score DESC
