metadata:
  name: "sqlite-fts-insert-article"
  version: "1.0.0"
  description: >
    Insert a new article into the FTS5 virtual table.
    The FTS5 index is updated automatically on INSERT.

# Parameters:
#   {title}    - Article title
#   {body}     - Article body text (indexed for full-text search)
#   {category} - Article category

query: |
  INSERT INTO articles_fts (title, body, category)
  VALUES ({title}, {body}, {category})
