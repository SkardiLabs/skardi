kind: pipeline

metadata:
  name: "fts-search"
  version: "1.0.0"
  description: >
    Full-text search on a PostgreSQL table using websearch_to_tsquery.
    Returns matching rows ranked by ts_rank (higher = more relevant).

# Parameters:
#   {query} - Search terms (space-separated, "quoted" for phrase, OR for disjunction, -term for negation)
#   {limit} - Maximum number of results to return

spec:
  query: |
    SELECT id, title, category, _score
    FROM pg_fts('articles', 'body', {query}, {limit})
    ORDER BY _score DESC
