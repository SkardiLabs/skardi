data_sources:
  - name: "dataset_data_texts"
    type: "mongo"
    access_mode: "read_write"
    connection_string: "mongodb://localhost:27017"
    description: "MongoDB collection with text index for full-text search"
    options:
      database: "mydb"
      collection: "dataset_data_texts"
      primary_key: "dataId"
      user_env: "MONGO_USER"
      pass_env: "MONGO_PASS"
