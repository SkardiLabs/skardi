# Collapse the append-only staging log of delivery receipts into one row per
# (message, status) in Lance: a message has at most one sent, one delivered,
# and one read receipt, plus possibly a failed one. Same watermark rule as
# wa-merge-messages: {since} is a previous run's start minus an overlap,
# compared against the receiver's ingested_at, never against Meta's timestamp.
kind: job

metadata:
  name: "wa-merge-statuses"
  version: "1.0.0"
  description: "Dedup staging.main.wa_events_statuses into the wa_statuses Lance dataset"

spec:
  query: |
    SELECT message_id, waba_id, phone_number_id, status, status_at,
           recipient_id, conversation_id, conversation_origin,
           pricing_category, billable, error_code, raw, ingested_at
    FROM staging.main.wa_events_statuses
    WHERE ingested_at >= {since}
  destination:
    table: "wa_statuses"          # the `type: lance` source of that name in ctx_whatsapp.yaml
    mode: upsert
    merge_keys: [message_id, status]
    repeated_keys: keep_last
    create_if_missing: true
