kind: pipeline

metadata:
  name: "mysql-catalog-cross-table-join"
  version: "1.0.0"
  description: >
    Join users and orders entirely through the catalog, without registering
    each table individually. Both tables are addressed with the three-part
    catalog.schema.table reference.

# Parameters:
#   {limit} - Maximum number of rows to return

spec:
  query: |
    SELECT
      u.name      AS user_name,
      u.email     AS user_email,
      o.product,
      o.amount
    FROM mydb_catalog.mydb.users  u
    INNER JOIN mydb_catalog.mydb.orders o ON u.id = o.user_id
    ORDER BY o.id
    LIMIT {limit}
