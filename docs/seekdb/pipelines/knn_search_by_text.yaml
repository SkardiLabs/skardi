metadata:
  name: "seekdb-knn-search-by-text"
  version: "1.0.0"
  description: >
    KNN vector search driven by a text query. `candle()` embeds the query
    at execution time and feeds the resulting List<Float32> into
    seekdb_knn as the query vector — exercising the embedding-UDF arm of
    the seekdb_knn planner.

# Parameters:
#   {text} - free-text query; embedded inline
#   {k}    - number of nearest neighbours to return

query: |
  SELECT id, title, category, _score
  FROM seekdb_knn('docs_embed', 'embedding',
      candle('models/generated/bge-small-en-v1.5', {text}),
      'cosine', {k})
  ORDER BY _score ASC
