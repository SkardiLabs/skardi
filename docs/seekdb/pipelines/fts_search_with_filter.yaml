kind: pipeline

metadata:
  name: "seekdb-fts-search-with-filter"
  version: "1.0.0"
  description: >
    Native full-text search filtered by category. The WHERE predicate is
    pushed down into the SeekDB SELECT generated by seekdb_fts.

# Parameters:
#   {query}    - Search terms
#   {category} - Category to filter by
#   {limit}    - Maximum number of results to return

spec:
  query: |
    SELECT title, body, category, _score
    FROM seekdb_fts('articles', 'body', {query}, {limit})
    WHERE category = {category}
    ORDER BY _score DESC
