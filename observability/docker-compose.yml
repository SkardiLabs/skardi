# `docker compose up` (no profile) starts the FULL emitter-side stack
# used by `docs/observability.md` (Skardi pushing OTLP into
# otel-collector → tempo + prometheus + loki, all visible in
# Grafana).
#
# `docker compose --profile demo up prometheus loki` is the consumer-side
# subset used by `demo/otel_service_health/`: the demo only needs the
# Prometheus + Loki HTTP query endpoints (:9090 and :3100). No profile
# tagging is necessary on the service definitions because both
# Prometheus and Loki are already part of the default stack — operators
# running the full stack get them automatically; demo users explicitly
# pass `prometheus loki` as the service args. See `docs/otel/README.md`.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4317:4317"   # OTLP gRPC (app sends here)
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics scrape endpoint
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.6.0
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana queries here)
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    command: ["-config.file=/etc/tempo.yaml"]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml
    command: ["-config.file=/etc/loki/local-config.yaml"]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - tempo
      - prometheus
      - loki
    profiles: ["default"]
