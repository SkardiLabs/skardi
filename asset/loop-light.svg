<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="The loop: observe, learn, act — the toolset grew itself">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6a6f7a"/></marker>
<marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#bf6a02"/></marker>
</defs>
<rect x="440" y="40" width="400" height="172" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<circle cx="478" cy="82" r="16" fill="#0b8fd1"/>
<text x="478" y="87.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
<text x="506" y="89" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#1f2328">OBSERVE</text>
<text x="640.0" y="126" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#59636e">the agent asks anything, in SQL,</text>
<text x="640.0" y="152" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#59636e">and declares why</text>
<text x="640.0" y="182" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#0b6e9e">POST /query + ai_context → audit ledger</text>
<rect x="856" y="428" width="400" height="172" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<circle cx="894" cy="470" r="16" fill="#0b8fd1"/>
<text x="894" y="475.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
<text x="922" y="477" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#1f2328">LEARN</text>
<text x="1056.0" y="514" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#59636e">read the ledger, group by session</text>
<text x="1056.0" y="540" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#59636e">and purpose — find the intentions</text>
<text x="1056.0" y="566" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#59636e">that keep coming back</text>
<rect x="24" y="428" width="400" height="172" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<circle cx="62" cy="470" r="16" fill="#0b8fd1"/>
<text x="62" y="475.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
<text x="90" y="477" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#1f2328">ACT</text>
<text x="224.0" y="514" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#59636e">recurring queries → named pipelines;</text>
<text x="224.0" y="540" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#59636e">recurring intentions → routines</text>
<text x="224.0" y="566" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#59636e">that run before they're asked</text>
<path d="M 846 150 Q 1078 208 1058 420" fill="none" stroke="#6a6f7a" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M 848 514 Q 640 562 436 514" fill="none" stroke="#6a6f7a" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M 222 420 Q 202 208 432 152" fill="none" stroke="#6a6f7a" stroke-width="2.5" marker-end="url(#arr)"/>
<g stroke="#bf6a02" stroke-width="2.5" fill="none"><path d="M 621 316 A 22 22 0 1 1 640 349" marker-end="url(#arr2)"/></g>
<text x="640" y="396" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-style="italic" fill="#bf6a02">the toolset grew itself</text>
</svg>
