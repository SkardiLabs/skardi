<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Skardi — Open Source Architecture</title>
  <desc id="desc">An agent data plane: any AI agent (Claude Code, Codex, custom) calls skardi-server through a uniform set of skills (rag, grep, batch, ingest); skardi-server federates governed access to PostgreSQL, MySQL, SQLite, MongoDB, Redis, LanceDB, Apache Iceberg, SeekDB, files (CSV / Parquet / JSON), and object stores (S3 / GCS / Azure).</desc>

  <defs>
    <style><![CDATA[
      .ink   { fill: #1f2328; }
      .ink2  { fill: #59636e; }
      .ink3  { fill: #818b98; }
      .accent{ fill: #0b8fd1; }
      .warn  { fill: #bf6a02; }
      .mono  { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .upper { letter-spacing: 0.10em; text-transform: uppercase; }
      .b     { font-weight: 600; }

      .card        { fill: #ffffff; stroke: #d1d9e0; }
      .card-soft   { fill: #f6f8fa; stroke: #e6ebf1; }
      .card-accent { fill: #ffffff; stroke: #7cc8e3; }
      .head-soft   { fill: #fafcfe; stroke: #eaeef2; }
      .head-accent { fill: #e6f6fc; stroke: #7cc8e3; }
      .pill-accent { fill: #e6f6fc; stroke: #7cc8e3; }
      .pill-warn   { fill: #fff4e0; stroke: #f0c178; }
      .pill-base   { fill: #f6f8fa; stroke: #d1d9e0; }
      .divider     { stroke: #eaeef2; stroke-width: 1; }
      .icon-bg     { fill: #e6f6fc; stroke: #7cc8e3; }
      .icon-bg-w   { fill: #fff4e0; stroke: #f0c178; }

      /* Marching-ants flow lines (cocoindex-style) */
      .flow-req  { animation: dash 6s linear infinite; }
      .flow-data { animation: dash-rev 5s linear infinite; }
      @keyframes dash      { to { stroke-dashoffset: -240; } }
      @keyframes dash-rev  { to { stroke-dashoffset:  240; } }

      /* Status dot heartbeat */
      .blink { animation: blink 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

      /* Subtle pulse on the agent-data-plane shield */
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

      /* Halo around skardi-server card */
      .halo { animation: halo 3.6s ease-in-out infinite; transform-origin: 700px 325px; }
      @keyframes halo {
        0%, 100% { opacity: 0.22; }
        50%      { opacity: 0.55; }
      }
    ]]></style>

    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b8fd1"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf6a02"/>
    </marker>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1f2328" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ============== STAGE BACKGROUND ============== -->
  <rect x="0" y="0" width="1280" height="620" fill="#ffffff"/>
  <rect x="12" y="12" width="1256" height="596" rx="14" ry="14" fill="#ffffff" stroke="#d1d9e0"/>
  <rect x="13" y="13" width="1254" height="594" rx="13" ry="13" fill="url(#grid)" opacity="0.7"/>

  <!-- header tag -->
  <g transform="translate(36, 38)">
    <circle class="blink" cx="6" cy="0" r="5" fill="#1a7f37"/>
    <text x="20" y="5" class="mono ink3 upper b" font-size="14">SKARDI · OPEN SOURCE</text>
  </g>

  <!-- bottom-right legend -->
  <g transform="translate(840, 580)" class="mono ink3" font-size="13">
    <line x1="0" y1="-4" x2="22" y2="-4" stroke="#0b8fd1" stroke-width="2.5"/>
    <text x="30" y="0">SQL / REST</text>
    <line x1="140" y1="-4" x2="162" y2="-4" stroke="#bf6a02" stroke-width="2.5"/>
    <text x="170" y="0">governed data</text>
    <text x="350" y="0" class="ink3">fig. 01 — skardi · open-source topology</text>
  </g>

  <!-- ============== CONNECTOR FLOW LINES ============== -->
  <!-- Agent → server -->
  <path d="M 470 340 C 510 340, 540 340, 560 340"
        fill="none" stroke="#0b8fd1" stroke-width="2.2" stroke-dasharray="8 8"
        class="flow-req" marker-end="url(#arrow-accent)"/>
  <text x="490" y="324" class="mono accent upper b" font-size="13">SQL / REST</text>

  <!-- Server → sources -->
  <path d="M 840 340 C 880 340, 900 340, 920 340"
        fill="none" stroke="#bf6a02" stroke-width="2.2" stroke-dasharray="8 8"
        class="flow-data" marker-end="url(#arrow-warn)"/>
  <text x="847" y="324" class="mono warn upper b" font-size="13">GOVERNED</text>

  <!-- ============== AGENT BOX (consolidated) ============== -->
  <text x="40" y="116" class="mono accent upper b" font-size="13">▍ Any AI Agent</text>

  <g transform="translate(40, 130)">
    <rect class="card" x="0" y="0" width="430" height="410" rx="12" ry="12"/>

    <!-- header bar -->
    <rect class="head-soft" x="1" y="1" width="428" height="74" rx="11" ry="11"/>
    <rect fill="#ffffff" x="1" y="40" width="428" height="35"/>
    <line x1="0" y1="74" x2="430" y2="74" class="divider"/>

    <!-- robot icon -->
    <g transform="translate(20, 22)">
      <rect class="icon-bg" x="0" y="0" width="32" height="32" rx="8" ry="8"/>
      <g transform="translate(4, 4)" fill="none" stroke="#0b8fd1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="9" width="18" height="13" rx="2"/>
        <circle cx="9" cy="15" r="1.3" fill="#0b8fd1"/>
        <circle cx="15" cy="15" r="1.3" fill="#0b8fd1"/>
        <path d="M10 19h4"/>
        <path d="M12 4v5M9 6l3 2 3-2"/>
      </g>
    </g>

    <text x="64" y="38" class="ink b" font-size="18">Agent</text>
    <text x="64" y="58" class="mono ink3 upper" font-size="13">claude code · codex · custom</text>

    <!-- skardi-skills pill -->
    <g transform="translate(322, 26)">
      <rect class="pill-accent" width="92" height="24" rx="12" ry="12"/>
      <text x="46" y="16" text-anchor="middle" class="mono accent b" font-size="13">skardi-skills</text>
    </g>

    <!-- 2 x 2 skill grid -->
    <line x1="215" y1="75" x2="215" y2="410" class="divider"/>
    <line x1="0" y1="242" x2="430" y2="242" class="divider"/>

    <!-- rag -->
    <g transform="translate(20, 100)">
      <rect class="icon-bg" x="0" y="0" width="36" height="36" rx="8" ry="8"/>
      <g transform="translate(8, 8)" fill="none" stroke="#0b8fd1" stroke-width="1.7" stroke-linecap="round">
        <circle cx="8" cy="8" r="5"/><path d="M11.5 11.5l5 5"/>
        <path d="M5 8h6M8 5v6" stroke-width="1.3"/>
      </g>
      <text x="50" y="16" class="mono ink b" font-size="16">rag</text>
      <text x="50" y="33" class="ink2" font-size="14">hybrid retrieval across sources</text>
    </g>

    <!-- grep -->
    <g transform="translate(235, 100)">
      <rect class="icon-bg" x="0" y="0" width="36" height="36" rx="8" ry="8"/>
      <text x="18" y="24" text-anchor="middle" class="mono accent b" font-size="14">&gt;_</text>
      <text x="50" y="16" class="mono ink b" font-size="16">grep</text>
      <text x="50" y="33" class="ink2" font-size="14">walk files · objects · tables</text>
    </g>

    <!-- batch -->
    <g transform="translate(20, 268)">
      <rect class="icon-bg-w" x="0" y="0" width="36" height="36" rx="8" ry="8"/>
      <g transform="translate(8, 8)" fill="none" stroke="#bf6a02" stroke-width="1.6" stroke-linejoin="round">
        <rect x="0" y="2" width="6" height="5" rx="1"/>
        <rect x="14" y="2" width="6" height="5" rx="1"/>
        <rect x="0" y="11" width="6" height="5" rx="1"/>
        <rect x="14" y="11" width="6" height="5" rx="1"/>
        <path d="M6 4.5h8M6 13.5h8M10 7v4" stroke-width="1.2"/>
      </g>
      <text x="50" y="16" class="mono ink b" font-size="16">batch</text>
      <text x="50" y="33" class="ink2" font-size="14">distributed jobs · poll · cancel</text>
    </g>

    <!-- ingest -->
    <g transform="translate(235, 268)">
      <rect class="icon-bg-w" x="0" y="0" width="36" height="36" rx="8" ry="8"/>
      <g transform="translate(8, 8)" fill="none" stroke="#bf6a02" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 1v11"/><path d="M5 8l5 5 5-5"/>
        <path d="M2 17h16" stroke-width="1.5"/>
      </g>
      <text x="50" y="16" class="mono ink b" font-size="16">ingest</text>
      <g transform="translate(98, 5)">
        <rect class="pill-base" width="72" height="16" rx="4" ry="4"/>
        <text x="36" y="12" text-anchor="middle" class="ink3" font-size="11">UPCOMING</text>
      </g>
      <text x="50" y="33" class="ink2" font-size="14">embed · chunk · atomic commit</text>
    </g>
  </g>

  <!-- ============== SKARDI-SERVER (Agent Data Plane) ============== -->
  <text x="560" y="96" class="mono accent upper b" font-size="13">▍ Agent Data Plane</text>

  <!-- soft halo -->
  <rect class="halo" x="544" y="100" width="312" height="448" rx="22" ry="22" fill="#0b8fd1" opacity="0.12"/>

  <g transform="translate(560, 110)">
    <rect class="card-accent" x="0" y="0" width="280" height="430" rx="12" ry="12"/>

    <!-- header (accent) -->
    <rect class="head-accent" x="1" y="1" width="278" height="44" rx="11" ry="11"/>
    <rect fill="#e6f6fc" x="1" y="22" width="278" height="22"/>
    <line x1="0" y1="44" x2="280" y2="44" stroke="#7cc8e3"/>

    <g transform="translate(14, 14)" class="pulse">
      <g fill="none" stroke="#0b8fd1" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">
        <path d="M9 0 L17 3 V9 C17 13.5 13.5 17 9 19 C4.5 17 1 13.5 1 9 V3 Z"/>
        <path d="M5.5 9.5l2.5 2.5 4-4"/>
      </g>
    </g>
    <text x="44" y="29" class="mono accent b upper" font-size="16">skardi-server</text>
    <text x="269" y="29" text-anchor="end" class="mono accent" font-size="11" opacity="0.8">rust · apache 2.0</text>

    <!-- Section 1: Federated SQL -->
    <g transform="translate(0, 48)">
      <circle cx="14" cy="13" r="3.5" fill="#0b8fd1"/>
      <text x="24" y="16" class="mono ink3 upper b" font-size="13">Federated SQL</text>
      <text x="14" y="38" class="mono ink2" font-size="14">DataFusion · JOIN any source</text>
      <line x1="14" y1="56" x2="266" y2="56" class="divider"/>
    </g>

    <!-- Section 2: Retrieval primitives -->
    <g transform="translate(0, 110)">
      <circle cx="14" cy="13" r="3.5" fill="#0b8fd1"/>
      <text x="24" y="16" class="mono ink3 upper b" font-size="13">Retrieval primitives</text>
      <text x="14" y="38" class="mono ink2" font-size="14">knn · fts · hybrid (RRF)</text>
      <line x1="14" y1="56" x2="266" y2="56" class="divider"/>
    </g>

    <!-- Section 3: Semantic layer -->
    <g transform="translate(0, 172)">
      <circle cx="14" cy="13" r="3.5" fill="#0b8fd1"/>
      <text x="24" y="16" class="mono ink3 upper b" font-size="13">Semantic layer</text>
      <text x="14" y="38" class="mono ink2" font-size="14">table descs · entity graph</text>
      <line x1="14" y1="56" x2="266" y2="56" class="divider"/>
    </g>

    <!-- Section 4: Catalog -->
    <g transform="translate(0, 234)">
      <circle cx="14" cy="13" r="3.5" fill="#0b8fd1"/>
      <text x="24" y="16" class="mono ink3 upper b" font-size="13">Catalog</text>
      <text x="14" y="38" class="mono ink2" font-size="14">GET /data_source · NL descs</text>
      <line x1="14" y1="56" x2="266" y2="56" class="divider"/>
    </g>

    <!-- Section 5: Embedding · ONNX -->
    <g transform="translate(0, 296)">
      <circle cx="14" cy="13" r="3.5" fill="#0b8fd1"/>
      <text x="24" y="16" class="mono ink3 upper b" font-size="13">Embedding · ONNX</text>
      <text x="14" y="38" class="mono ink2" font-size="14">embedding · -onnx</text>
      <line x1="14" y1="56" x2="266" y2="56" class="divider"/>
    </g>

    <!-- Section 6: Governance -->
    <g transform="translate(0, 358)">
      <circle cx="14" cy="13" r="3.5" fill="#0b8fd1"/>
      <text x="24" y="16" class="mono ink3 upper b" font-size="13">Governance</text>
      <g transform="translate(14, 28)">
        <g>
          <rect class="pill-accent" width="48" height="20" rx="10" ry="10"/>
          <text x="24" y="14" text-anchor="middle" class="mono accent b" font-size="12">RBAC</text>
        </g>
        <g transform="translate(54, 0)">
          <rect class="pill-accent" width="92" height="20" rx="10" ry="10"/>
          <text x="46" y="14" text-anchor="middle" class="mono accent b" font-size="12">agent identity</text>
        </g>
        <g transform="translate(152, 0)">
          <rect class="pill-accent" width="50" height="20" rx="10" ry="10"/>
          <text x="25" y="14" text-anchor="middle" class="mono accent b" font-size="12">audit</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ============== SOURCES ============== -->
  <text x="920" y="66" class="mono ink3 upper b" font-size="13">▍ Sources</text>

  <g transform="translate(920, 80)">
    <rect class="card" x="0" y="0" width="320" height="500" rx="12" ry="12"/>

    <!-- head -->
    <rect class="head-soft" x="1" y="1" width="318" height="40" rx="11" ry="11"/>
    <rect fill="#ffffff" x="1" y="20" width="318" height="20"/>
    <line x1="0" y1="40" x2="320" y2="40" class="divider"/>
    <text x="16" y="26" class="mono ink3 upper b" font-size="13">Sources</text>
    <g transform="translate(266, 12)">
      <rect class="pill-base" width="38" height="18" rx="9" ry="9"/>
      <text x="19" y="13" text-anchor="middle" class="mono ink3 b" font-size="11">10+</text>
    </g>

    <!-- 10 cells, 46h each starting at y=40 -->
    <g class="src-cells">
      <!-- PostgreSQL -->
      <g transform="translate(0, 40)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#336791" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M5 9c0-3 2-5 5-5 2 0 3 .8 4 2 1-.7 2-1 3-1 3 0 4 2 4 4 0 2-1 3.3-2 4 0 2 .5 3.5-.5 5-1 1.5-3 2-5 2-1 0-2-.3-3-1-1 .5-2 1-3 1-2 0-3.5-1-3.5-3"/>
          <circle cx="9" cy="10" r=".8" fill="#336791" stroke="none"/>
          <path d="M14 11c-.5 1-.5 2 0 3"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">PostgreSQL</text>
        <text x="50" y="38" class="mono ink3" font-size="12">+ pgvector</text>
      </g>

      <!-- MySQL -->
      <g transform="translate(0, 86)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#00758F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 14c2-4 6-6 10-6 3 0 5 1 7 3-2 0-3 1-4 2-1 1-3 2-5 2-3 0-5-.5-8-1Z"/>
          <path d="M16 11l3-2"/>
          <circle cx="18" cy="10" r=".5" fill="#00758F" stroke="none"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">MySQL</text>
        <text x="50" y="38" class="mono ink3" font-size="12">full CRUD</text>
      </g>

      <!-- SQLite -->
      <g transform="translate(0, 132)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#003B57" stroke-width="1.5" stroke-linejoin="round">
          <path d="M4 4h12l4 4v12H4z" fill="#0F80CC" fill-opacity=".18"/>
          <path d="M7 10c2-2 6-2 9 0M8 14c2-1.5 5-1.5 7 0"/>
          <path d="M16 4v4h4"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">SQLite</text>
        <text x="50" y="38" class="mono ink3" font-size="12">FTS · vec</text>
      </g>

      <!-- MongoDB -->
      <g transform="translate(0, 178)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#13AA52" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2c2.5 4 4.5 7.5 4.5 11.5S14 20 12 22c-2-2-4.5-4.5-4.5-8.5S9.5 6 12 2Z" fill="#13AA52" fill-opacity=".15"/>
          <path d="M12 4v18"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">MongoDB</text>
        <text x="50" y="38" class="mono ink3" font-size="12">document</text>
      </g>

      <!-- Redis -->
      <g transform="translate(0, 224)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#DC382C" stroke-width="1.5" stroke-linejoin="round">
          <path d="M3 7l9-3 9 3-9 3-9-3Z" fill="#DC382C" fill-opacity=".18"/>
          <path d="M3 12l9 3 9-3"/>
          <path d="M3 17l9 3 9-3"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">Redis</text>
        <text x="50" y="38" class="mono ink3" font-size="12">KV · cache</text>
      </g>

      <!-- LanceDB -->
      <g transform="translate(0, 270)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#0b8fd1" stroke-width="1.5" stroke-linejoin="round">
          <path d="M12 3l8 9-8 9-8-9 8-9Z" fill="#0b8fd1" fill-opacity=".15"/>
          <path d="M12 3v18M4 12h16"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">LanceDB</text>
        <text x="50" y="38" class="mono ink3" font-size="12">KNN · BM25</text>
      </g>

      <!-- Iceberg -->
      <g transform="translate(0, 316)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#2B6FB0" stroke-width="1.5" stroke-linejoin="round">
          <path d="M6 12l3-7 3 4 4-3 2 6Z" fill="#2B6FB0" fill-opacity=".18"/>
          <path d="M3 13h18" stroke-dasharray="2 2"/>
          <path d="M5 13l4 6 6-1 4-5" fill="#2B6FB0" fill-opacity=".10"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">Iceberg</text>
        <text x="50" y="38" class="mono ink3" font-size="12">partitioned</text>
      </g>

      <!-- SeekDB -->
      <g transform="translate(0, 362)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#6a6f7a" stroke-width="1.5" stroke-linejoin="round">
          <circle cx="11" cy="11" r="6"/>
          <path d="M16 16l4 4"/>
          <circle cx="11" cy="11" r="2" fill="#6a6f7a" fill-opacity=".30"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">SeekDB</text>
        <text x="50" y="38" class="mono ink3" font-size="12">FTS · HNSW</text>
      </g>

      <!-- Files -->
      <g transform="translate(0, 408)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#6a6f7a" stroke-width="1.5" stroke-linejoin="round">
          <path d="M6 3h9l4 4v14H6z" fill="#6a6f7a" fill-opacity=".10"/>
          <path d="M15 3v4h4"/>
          <path d="M9 12h7M9 15h5M9 18h7"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">CSV · Parquet · JSON</text>
        <text x="50" y="38" class="mono ink3" font-size="12">files</text>
      </g>

      <!-- Object stores -->
      <g transform="translate(0, 454)">
        <line x1="0" y1="0" x2="320" y2="0" class="divider"/>
        <g transform="translate(14, 9)" fill="none" stroke="#E25444" stroke-width="1.5" stroke-linejoin="round">
          <path d="M5 7h14l-1 13H6Z" fill="#E25444" fill-opacity=".15"/>
          <path d="M5 7c0-2 3-3 7-3s7 1 7 3"/>
          <path d="M9 11v5M15 11v5"/>
        </g>
        <text x="50" y="20" class="ink b" font-size="16">S3 · GCS · Azure</text>
        <text x="50" y="38" class="mono ink3" font-size="12">object store</text>
      </g>
    </g>
  </g>
</svg>
