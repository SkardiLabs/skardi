# Merge this data source into your ctx.yaml's spec.data_sources.
# hierarchy_level: catalog registers the file as the 'gh_search'
# catalog — the generated SQL's 'gh_search.main.…' qualification
# depends on it. access_mode: read_write is what the ingest job's
# WRITE path requires. options.extensions_env names the env var
# holding the sqlite-vec (vec0) loadable — required for the vector
# arm; export it before starting the server.
spec:
  data_sources:
    - name: gh_search
      type: sqlite
      path: data/gh.db
      access_mode: read_write
      hierarchy_level: catalog
      options:
        extensions_env: SQLITE_VEC_PATH
