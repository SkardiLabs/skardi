kind: pipeline
metadata:
  name: mock-items-search-get-document
  version: "1.0.0"
  description: >-
    Fetch one document's chunks, ordered by chunk_index, by the (source_table, source_id) pair every search hit returns — full-document reassembly and neighbor-chunk context in one call.
spec:
  query: |
    -- One document's ordered chunks: reassembly and neighbor-chunk
    -- context in one call, drivable from any search hit (FR-9 returns
    -- source_table/source_id with every row). Same defense-in-depth
    -- doc_id dedup as search (write-time replacement already keeps one
    -- copy): newest wins (max rid = latest insert).
    WITH chunks AS (
      SELECT doc_id, source_table, source_id, chunk_index, title, content,
             author, created_at,
             ROW_NUMBER() OVER (PARTITION BY doc_id ORDER BY rid DESC) AS dup_rank
      FROM gh_search.main.documents
      WHERE source_table = {source_table} AND source_id = {source_id}
    )
    SELECT doc_id, source_table, source_id, chunk_index, title, content,
           author, created_at
    FROM chunks
    WHERE dup_rank = 1
    ORDER BY chunk_index
