kind: job
metadata:
  name: mock-items-search-ingest-items
  version: "1.0.0"
  description: >-
    Generated by skardi-etl: chunk + embed one source table into the
    documents index. Append-only; the source exposes no timestamp pushdown, so refresh = setup --reset + full re-run.
spec:
  query: |
    SELECT
      CAST(NULL AS BIGINT)                                    AS rid,
      arrow_cast('items:' || arrow_cast(u.id, 'Utf8') || ':'
        || arrow_cast(u.part['chunk_idx'], 'Utf8'), 'Utf8')   AS doc_id,
      'items'                                               AS source_table,
      arrow_cast(u.id, 'Utf8')                              AS source_id,
      arrow_cast(NULL, 'Utf8')                                                 AS title,
      u.part['chunk_text']                                    AS content,
      -- BIGINT: the INTEGER destination column reads back as Int64 and
      -- the executor's type preflight is exact (chunk_idx is Int32).
      CAST(u.part['chunk_idx'] AS BIGINT)                     AS chunk_index,
      arrow_cast(NULL, 'Utf8')                                                AS author,
      arrow_cast(u.created_at, 'Utf8')                                            AS created_at,
      json_pack('value', u.value, 'tags', u.tags)                                              AS metadata,
      vec_to_binary(candle('models/generated/bge-small-en-v1.5', u.part['chunk_text']))                             AS embedding
    FROM (
      SELECT s.*, UNNEST(chunk_parts('markdown', s.name, 1200, 200)) AS part
      FROM (
        SELECT id, name, created_at, value, tags
        FROM saas.mock_demo.items
        LIMIT {limit}
      ) s
    ) u
  destination:
    table: gh_search.main.documents
    mode: append
  execution: {}
