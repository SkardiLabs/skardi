kind: job
metadata:
  name: github-issues-search-ingest-issues
  version: "1.0.0"
  description: >-
    Generated by skardi-etl: chunk + embed one source table into the
    documents index. Append-only; re-run with -p since=<last watermark> for incremental refresh (overlap is safe; each doc_id's previous copy is replaced at write time).
spec:
  query: |
    SELECT
      CAST(NULL AS BIGINT)                                    AS rid,
      arrow_cast('issues:' || arrow_cast(u.number, 'Utf8') || ':'
        || arrow_cast(u.part['chunk_idx'], 'Utf8'), 'Utf8')   AS doc_id,
      'issues'                                               AS source_table,
      arrow_cast(u.number, 'Utf8')                              AS source_id,
      u.title                                                 AS title,
      u.part['chunk_text']                                    AS content,
      -- BIGINT: the INTEGER destination column reads back as Int64 and
      -- the executor's type preflight is exact (chunk_idx is Int32).
      CAST(u.part['chunk_idx'] AS BIGINT)                     AS chunk_index,
      u.author_login                                                AS author,
      arrow_cast(u.updated_at, 'Utf8')                                            AS created_at,
      json_pack('number', u.number, 'state', u.state)                                              AS metadata,
      vec_to_binary(candle('models/generated/bge-small-en-v1.5', u.part['chunk_text']))                             AS embedding
    FROM (
      SELECT s.*, UNNEST(chunk_parts('markdown', s.body, 1200, 200)) AS part
      FROM (
        SELECT number, body, title, author_login, updated_at, state
        FROM saas.github_demo.issues
      WHERE updated_at >= {since}
        LIMIT {limit}
      ) s
    ) u
  destination:
    table: gh_search.main.documents
    mode: append
  execution: {}
