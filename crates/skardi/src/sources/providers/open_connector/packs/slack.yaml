# Slack source pack. Wire contract is Open Connector's NORMALIZED shape
# (camelCase rows, top-level nextCursor, executor-consumed ok:false),
# reconciled against a live gateway (v1.3.1); fingerprints are pinned
# from that capture. Design rationale lives in packs/slack.rs.
kind: pack
pack: slack
version: 1

tables:
  conversations:
    action: slack.list_conversations
    row_path: "$.conversations"
    fingerprint: 2d4e5cee7cf87f146ab7848849f97a559ba44ff09350295e0dc50b75abf0ef84
    pagination:
      strategy: cursor
      page_size_input: limit
      cursor_input: cursor
      next_cursor_path: "$.nextCursor"
      page_size: 200
    fixed_inputs:
      types: [public_channel, private_channel]
    columns:
      - { name: id, path: channelId, type: utf8, nullable: false }
      - { name: name, path: name, type: utf8, nullable: true }
      - { name: type, path: type, type: utf8, nullable: true }
      - { name: is_private, path: isPrivate, type: boolean, nullable: true }
      - { name: is_archived, path: isArchived, type: boolean, nullable: true }
      - { name: is_member, path: isMember, type: boolean, nullable: true }
      - { name: member_count, path: memberCount, type: uint64, nullable: true }
      - { name: topic, path: topic, type: utf8, nullable: true }
      - { name: purpose, path: purpose, type: utf8, nullable: true }

  messages:
    # The governed content table: one conversation's history, bound by
    # `channelId` (the same key skardi-cloud's registry binds — the strings
    # are one contract). Cursor pagination exists because our vendored build
    # added it: the upstream action dropped Slack's cursor on the floor, and
    # single_page's premise check refuses a boolean hasMore. Fingerprint
    # pinned from OUR build b2b33e57 (skardi/slack-acl in open-connector),
    # not an oomol-lab release.
    action: slack.get_channel_messages
    row_path: "$.messages"
    fingerprint: 979c92a8816ee0f1fcb8c9ca62aee4028ebbe5b09222e8cb7ce4d7f4021d395b
    pagination:
      strategy: cursor
      page_size_input: limit
      cursor_input: cursor
      next_cursor_path: "$.nextCursor"
      page_size: 999
    resources:
      required: [channelId]
    fixed_inputs:
      # Load-bearing, not a default. Slack's `oldest` is EXCLUSIVE unless
      # this is set, and the `sent_at` filter below floors its literal to a
      # whole second — so a message sitting exactly on that second would be
      # dropped by the provider, and Inexact re-filtering cannot recover a
      # row that never arrived. Slack ignores the flag when neither bound
      # is sent, so it costs nothing on an unfiltered scan.
      inclusive: true
    columns:
      # `ts` is the message's identity (unique per conversation, and the
      # handle `conversations.replies` and permalinks take), so it stays the
      # raw string. `sent_at` reads the SAME field as a time, because a
      # pushdown needs a Timestamp-typed column and Arrow milliseconds
      # cannot hold Slack's microseconds — splitting them keeps identity
      # exact and makes the truncation visible in the schema.
      - { name: ts, path: ts, type: utf8, nullable: false }
      - { name: sent_at, path: ts, type: timestamp_s_frac_string_utc, nullable: false }
      - { name: type, path: type, type: utf8, nullable: true }
      - { name: subtype, path: subtype, type: utf8, nullable: true }
      - { name: user_id, path: userId, type: utf8, nullable: true }
      - { name: bot_id, path: botId, type: utf8, nullable: true }
      - { name: app_id, path: appId, type: utf8, nullable: true }
      - { name: username, path: username, type: utf8, nullable: true }
      - { name: team_id, path: teamId, type: utf8, nullable: true }
      - { name: client_msg_id, path: clientMsgId, type: utf8, nullable: true }
      - { name: text, path: text, type: utf8, nullable: true }
      - { name: edited_ts, path: editedTs, type: utf8, nullable: true }
      - { name: thread_ts, path: threadTs, type: utf8, nullable: true }
      - { name: parent_user_id, path: parentUserId, type: utf8, nullable: true }
      - { name: reply_count, path: replyCount, type: uint64, nullable: true }
      - { name: reply_users_count, path: replyUsersCount, type: uint64, nullable: true }
      - { name: latest_reply, path: latestReply, type: utf8, nullable: true }
      - { name: is_locked, path: isLocked, type: boolean, nullable: true }
    filters:
      # The whole point of the table's incremental story: `sent_at >= X`
      # becomes Slack's `oldest`, so a scheduled run fetches the delta
      # instead of the channel's entire history. Inexact and gt_eq are both
      # forced by the epoch-seconds rendering (see ValueFormat) — the
      # floored literal widens the fetch by up to a second and DataFusion
      # trims it back. The STRING spelling because the action types
      # `oldest` as a Slack `ts` string under a strict
      # `additionalProperties: false` schema: a bare JSON number is a 400,
      # not a coercion.
      - { column: sent_at, op: gt_eq, input: oldest, format: epoch_seconds_string, fidelity: inexact }

  users:
    action: slack.list_users
    row_path: "$.users"
    fingerprint: 77f3f0f41d30b9095875b1c02d5f93f31b948f4a666fdfc820192348e5e1b18f
    pagination:
      strategy: cursor
      page_size_input: limit
      cursor_input: cursor
      next_cursor_path: "$.nextCursor"
      page_size: 200
    fixed_inputs:
      includeLocale: true
    columns:
      - { name: id, path: userId, type: utf8, nullable: false }
      - { name: name, path: username, type: utf8, nullable: true }
      - { name: real_name, path: realName, type: utf8, nullable: true }
      - { name: display_name, path: displayName, type: utf8, nullable: true }
      - { name: is_bot, path: isBot, type: boolean, nullable: true }
      - { name: is_admin, path: isAdmin, type: boolean, nullable: true }
      - { name: is_owner, path: isOwner, type: boolean, nullable: true }
      - { name: deleted, path: isDeleted, type: boolean, nullable: true }
      - { name: locale, path: locale, type: utf8, nullable: true }

  files:
    action: slack.list_files
    row_path: "$.files"
    fingerprint: 54f3b15b426612c2d0bd0291d2cabb1cbf18c5f5061bce13b53e93fa1bba4ac2
    pagination:
      strategy: page_number
      page_input: page
      page_size_input: count
      page_size: 100
      total_pages_path: "$.paging.pages"
    resources:
      optional: [channelId]
    columns:
      - { name: id, path: id, type: utf8, nullable: false }
      - { name: name, path: name, type: utf8, nullable: true }
      - { name: title, path: title, type: utf8, nullable: true }
      - { name: filetype, path: filetype, type: utf8, nullable: true }
      - { name: mimetype, path: mimetype, type: utf8, nullable: true }
      - { name: size, path: size, type: uint64, nullable: true }
      - { name: user_id, path: user, type: utf8, nullable: true }
      - { name: channels, path: channels, type: utf8_list, nullable: true }
      - { name: is_public, path: is_public, type: boolean, nullable: true }
      - { name: created, path: created, type: timestamp_s_utc, nullable: true }
      - { name: permalink, path: permalink, type: utf8, nullable: true }
    filters:
      # No time filter is pushed: the list_files contract declares no
      # ts_from-style input and its strict schema would 400 one.
      - { column: user_id, op: eq, input: userId, fidelity: inexact }
