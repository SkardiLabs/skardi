# Notion source pack. Wire contract reconciled against a live Open
# Connector gateway: raw-passthrough executors (rows are Notion API
# objects verbatim), camelCase strict inputs (startCursor/pageSize),
# Notion's native cursor envelope ($.next_cursor, null at end — has_more
# is redundant with the null cursor and deliberately unused). Design
# rationale lives in the module docs of packs/notion.rs.
#
# Column sets are reconciled against REAL rows from a live Notion
# workspace through the gateway (2026-08-03, gateway pins
# Notion-Version 2026-03-11): pages carry `is_archived` (not the
# `archived` the captured contract declares), and data sources and
# blocks carry no archived flag at all — `in_trash` is the deletion
# signal on every object.
kind: pack
pack: notion
version: 1

tables:
  users:
    action: notion.list_users
    row_path: "$.results"
    fingerprint: 2c7a234b30e3b016a4405586602c2bbe9e8fe873eb9b62c5257c98eb3f099421
    pagination:
      strategy: cursor
      cursor_input: startCursor
      next_cursor_path: "$.next_cursor"
      page_size_input: pageSize
      page_size: 100
    columns:
      # person.email is deliberately NOT mapped: it is capability-gated on
      # the integration and privacy-sensitive; the raw `person` object is
      # not exposed either, for the same reason.
      - { name: id, path: id, type: utf8, nullable: false }
      - { name: name, path: name, type: utf8, nullable: true }
      - { name: type, path: type, type: utf8, nullable: true }
      - { name: avatar_url, path: avatar_url, type: utf8, nullable: true }

  pages:
    action: notion.search
    row_path: "$.results"
    fingerprint: a7d90d2d753b28954b1bf77c26abc2ff4b36caf905c8c1fc74a182acb2a6e9d1
    pagination:
      strategy: cursor
      cursor_input: startCursor
      next_cursor_path: "$.next_cursor"
      page_size_input: pageSize
      page_size: 100
    # The empty query plus an object filter is Notion's spelling for
    # "everything the integration can see, AS SEARCH REPORTS IT". Not an
    # inventory: Notion documents that search may omit an accessible page,
    # lag after a share, and change while paging, so a row's absence from a
    # drained walk is not evidence that the page is gone. A consumer that
    # removes on absence removes live pages; add on presence, and prove
    # removal with a direct read.
    fixed_inputs:
      query: ""
      filter:
        property: object
        value: page
    columns:
      # `properties` is the page's dynamic property map — opaque JSON by
      # design; typed projection of dynamic schemas is the deferred
      # query_data_source work.
      - { name: id, path: id, type: utf8, nullable: false }
      - { name: created_time, path: created_time, type: timestamp_ms_utc, nullable: true }
      - { name: last_edited_time, path: last_edited_time, type: timestamp_ms_utc, nullable: true }
      - { name: is_archived, path: is_archived, type: boolean, nullable: true }
      - { name: in_trash, path: in_trash, type: boolean, nullable: true }
      - { name: url, path: url, type: utf8, nullable: true }
      - { name: public_url, path: public_url, type: utf8, nullable: true }
      - { name: parent, path: parent, type: json, nullable: true }
      - { name: properties, path: properties, type: json, nullable: true }

  data_sources:
    action: notion.search
    row_path: "$.results"
    fingerprint: a7d90d2d753b28954b1bf77c26abc2ff4b36caf905c8c1fc74a182acb2a6e9d1
    pagination:
      strategy: cursor
      cursor_input: startCursor
      next_cursor_path: "$.next_cursor"
      page_size_input: pageSize
      page_size: 100
    fixed_inputs:
      query: ""
      filter:
        property: object
        value: data_source
    columns:
      - { name: id, path: id, type: utf8, nullable: false }
      - { name: created_time, path: created_time, type: timestamp_ms_utc, nullable: true }
      - { name: last_edited_time, path: last_edited_time, type: timestamp_ms_utc, nullable: true }
      - { name: title, path: title, type: utf8_list_from_object_key, key: plain_text, nullable: true }
      - { name: in_trash, path: in_trash, type: boolean, nullable: true }
      - { name: url, path: url, type: utf8, nullable: true }
      - { name: public_url, path: public_url, type: utf8, nullable: true }
      - { name: parent, path: parent, type: json, nullable: true }
      - { name: properties, path: properties, type: json, nullable: true }

  block_children:
    action: notion.list_block_children
    row_path: "$.results"
    fingerprint: 69f20cdc842b890c280265048d143d36de1699396b8ca4f53f7a7f203b7bd51c
    pagination:
      strategy: cursor
      cursor_input: startCursor
      next_cursor_path: "$.next_cursor"
      page_size_input: pageSize
      page_size: 100
    resources:
      required: [blockId]
    columns:
      # The type-specific payload (paragraph/heading_1/...) lives under a
      # key named BY `type`, which a fixed relational mapping cannot
      # address; the page's TEXT is `page_markdown` below.
      - { name: id, path: id, type: utf8, nullable: false }
      - { name: type, path: type, type: utf8, nullable: true }
      - { name: created_time, path: created_time, type: timestamp_ms_utc, nullable: true }
      - { name: last_edited_time, path: last_edited_time, type: timestamp_ms_utc, nullable: true }
      - { name: has_children, path: has_children, type: boolean, nullable: true }
      - { name: in_trash, path: in_trash, type: boolean, nullable: true }
      - { name: parent, path: parent, type: json, nullable: true }

  # One row per PAGE, rendered as Markdown by Open Connector's normalized
  # `notion.retrieve_page_markdown` (c5a77846+). The pack's first
  # `row_shape: object` table for Notion, for the reason feishu's
  # `document_content` is: a "read one thing" action answers with the row
  # itself rather than a list, and there is no second page of a page's text.
  # Its output schema DECLARES every field with `additionalProperties:
  # false`, so — unlike every other notion table — these columns sit INSIDE
  # the fingerprint gate: an upstream rename fails registration instead of
  # surfacing as a null column at scan time.
  page_markdown:
    action: notion.retrieve_page_markdown
    row_path: "$"
    row_shape: object
    fingerprint: d77029cf6920c55736345faf4807347632b54e355ddd2e48faff963bee6ecc23
    pagination:
      strategy: single_page
    resources:
      required: [pageId]
    columns:
      # Echoed from the INPUT by the action, so it is the binding's spelling
      # and joins to it; Notion spells ids dashed or undashed in its own
      # bodies.
      - { name: page_id, path: pageId, type: utf8, nullable: false }
      # Never null: the action coerces an empty render to "", so an empty
      # corpus row is a real empty page rather than a fetch that half-failed.
      - { name: markdown, path: markdown, type: utf8, nullable: false }
      # A 200 is not a whole page. `truncated` fires past roughly 20,000
      # blocks and is retryable by resubmitting the listed ids;
      # `unknown_block_ids` (at most 100) ALSO covers unsupported block
      # types, so it is non-empty on ordinary pages and is not on its own a
      # partial-read signal. Read together.
      - { name: truncated, path: truncated, type: boolean, nullable: false }
      - { name: unknown_block_ids, path: unknownBlockIds, type: json, nullable: false }
      # The markdown endpoint reports no revision; the action reads this off
      # `GET /pages/{id}`. It is what lets a consumer window its ingest on
      # the page's own clock instead of re-loading every page every run.
      - { name: last_edited_time, path: lastEditedTime, type: timestamp_ms_utc, nullable: false }
