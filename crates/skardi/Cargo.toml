[package]
name = "skardi"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
onnx = ["dep:ort", "dep:ndarray", "dep:num_cpus"]
embedding = ["onnx", "candle", "gguf", "remote-embed"]
# reqwest is a hard dependency (the Open Connector client uses it
# unconditionally); these features now only gate their UDF code.
remote-embed = []
# llm_extract scalar UDF — fully independent, NO documents dependency.
llm-extract = ["dep:base64"]
gguf = ["dep:llama-cpp-4"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
chunking = ["dep:text-splitter"]
# RAG umbrella: chunk → embed → write loop in one feature.
rag = ["embedding", "chunking"]
# documents source connector: parse a folder of files into queryable (file, page) rows.
documents = ["dep:liteparse", "dep:glob", "dep:object_store"]
# rss source connector: RSS/Atom/JSON-Feed subscriptions as queryable tables.
# reqwest/gzip: the fetcher decodes gzip-compressed feed responses itself
# (the response-size cap is measured on the decoded stream), which needs the
# builder's `.gzip(true)` — behind reqwest's own `gzip` Cargo feature, off by
# default alongside the crate's other unconditional reqwest features.
#
# This flag's reach is at least workspace-wide, not scoped to the fetcher or
# even to this crate: Cargo unifies features for one resolved package across
# a whole build, and `crates/cli` depends on the same `reqwest 0.12`
# resolution this crate does, so a build that includes both with `rss`
# enabled (e.g. CI's `--all-features` run) turns gzip decoding on for
# `crates/cli`'s client too. Within this crate, it also reaches Open
# Connector's client (open_connector/client.rs, which never asks for it):
# reqwest defaults gzip decoding to on for every `reqwest::Client` built once
# the Cargo feature is compiled in, so OC's client gets transparent gzip
# decoding and an `accept-encoding: gzip` header on its own requests. That
# does not weaken its response-size bound — the bound is enforced again
# while streaming the body regardless — but it does mean its
# `content_length()` early reject simply does not fire for a compressed
# response: reqwest strips both `Content-Encoding` and `Content-Length` from
# the header set when it installs a gzip decoder, and `content_length()`
# itself reads the body's size hint rather than the header, so it returns
# `None` — not an under-reported wire size — the moment decoding is applied.
# The third in-crate client, llm_extract's opt-in image fetch
# (`model/llm_extract/mod.rs`, the `LLM_EXTRACT_IMAGE_FETCH=1` path), reads
# with an unbounded `resp.bytes()` and so — unlike OC — has no streaming
# bound to fall back on; auto-gzip would have handed an
# attacker-influenceable `image_ref` a ~1000:1 decompression amplifier. It
# pins `no_gzip()` on its builder (raw image bytes want no content
# negotiation), which holds in every build because reqwest provides
# `no_gzip()` independent of the Cargo feature.
rss = [
    "dep:quick-xml",
    "reqwest/gzip",
    "dep:encoding_rs",
    "dep:htmd",
    "dep:feed-rs",
]

[dependencies]
# engine
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
datafusion = { workspace = true }
datafusion-common = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
arrow = { workspace = true }
tracing = { workspace = true }
# pipeline
log = { workspace = true }
regex = { workspace = true }
# preserve_order is LOAD-BEARING: json_pack's argument-order-is-object-order
# contract (and the etl golden bundles' byte determinism) rides on
# serde_json::Map preserving insertion order. Without the explicit feature
# it held only through transitive unification (bson enables it) — a dep
# change away from silently becoming lexicographic.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true }
# model
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = { version = "0.22", optional = true }
ndarray = { version = "0.17", optional = true }
num_cpus = { version = "1.17.0", optional = true }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"], optional = true }
llama-cpp-4 = { version = "0.2", optional = true }
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
text-splitter = { version = "0.30", features = ["markdown"], optional = true }
# sources
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
# Direct dep on the same client `datafusion-table-providers` uses, so catalog
# introspection can run one batched `system.tables` query instead of N+1.
clickhouse = { workspace = true }
datafusion-federation = { workspace = true }
datafusion-table-providers = { workspace = true }
derivative = "2.2.0"
futures = { workspace = true }
hex = "0.4"
# Already in the tree transitively (reqwest → hyper), promoted to a direct
# dependency for `util::http::parse_retry_after`'s HTTP-date form.
httpdate = "1.0"
iceberg = { workspace = true }
iceberg-datafusion = { workspace = true }
iceberg-storage-opendal = { workspace = true }
lance = { workspace = true }
lance-index = { workspace = true }
mongodb = "3.1"
mysql_async = "0.36"
percent-encoding = "2.3"
# rss source connector (optional, behind the `rss` feature): parses OPML
# subscription lists — this phase's only quick-xml user, and it could ride any
# version. `Cargo.lock` today carries two quick-xml versions from deps this
# crate does not control — `reqsign` requires exactly 0.37 and
# `opendal`/`object_store` require exactly 0.38 — plus 0.41, pulled solely by
# this line's own direct dependency. We pin 0.41 in anticipation of `feed-rs`
# (added later in this stack, for feed bodies themselves), whose own XML
# backend is also quick-xml and will want 0.41. Pinning now means feed-rs's
# arrival adds no fourth quick-xml version: our own direct usage already rides
# the version it will pull.
quick-xml = { version = "0.41", optional = true }
redis = { version = "1.0.0-rc.2", default-features = false, features = ["cluster"] }
# documents source connector (optional, behind the `documents` feature).
# Pulls in native PDFium (downloaded by pdfium-sys build.rs).
# `default-features = false` drops liteparse's bundled `tesseract` OCR engine, whose
# `tesseract-rs -> zip -> xz2 -> lzma-sys` chain collides with DataFusion's `liblzma-sys`
# (two crates can't both `links = "lzma"`) and also forces a newer tokio. OCR is still
# available at runtime via liteparse's HTTP OCR engine (config `ocr_server_url`).
liteparse = { version = "2.4.0", default-features = false, optional = true }
# Stable fingerprints for Open Connector contracts and document IDs.
blake3 = "1"
# include_globs matching for the documents connector.
glob = { version = "0.3", optional = true }
# Label lookup + transcoding for the rss sanitation ladder's re-encode rung.
encoding_rs = { version = "0.8", optional = true }
# Deterministic HTML→Markdown for rss item content.
htmd = { version = "0.5.5", optional = true }
# RSS 0.9x/1.0/2.0, Atom, and JSON Feed parsing into one model.
feed-rs = { version = "2.4", optional = true }
# object-store (S3/GCS/Azure) backend for the documents connector's source `path`
# and `image_store`. Only the `aws` scheme is wired in v1 (see blob.rs).
object_store = { workspace = true, optional = true }
secrecy = "0.10"
pgvector = { version = "0.4", features = ["sqlx"] }
sqlx = { workspace = true }
thiserror = "2.0"
tokio-rusqlite = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
datafusion-functions-json = "0.52"

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
redis-test = "0.13.0"
gguf-rs-lib = "0.2"
# Seeding / cleaning object-store fixtures in the opt-in `documents_s3_live`
# integration test (it drives S3 directly, not through the connector).
object_store = { workspace = true }
futures = { workspace = true }
