[package]
name = "skardi-cli"
version.workspace = true
edition.workspace = true
description = "CLI tool for managing Skardi pipelines and data sources"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[[bin]]
name = "skardi"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The MCP-over-stdio bridge (`skardi mcp`). default-features = false keeps
# rmcp's optional stacks out of THIS crate's own dependency graph;
# `transport-io` is the server-side stdio transport. Note: with resolver = "2",
# a whole-workspace build unifies features across members, so skardi-server's
# rmcp HTTP features do get compiled into that build graph — the pin here
# governs what `cargo build -p skardi-cli` alone pulls in. rmcp has no runtime
# axum dependency (verified against the 3.1.4 source), so no axum skew either way.
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-io"] }
skardi-mcp-core = { path = "../mcp-core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
# PKCE S256 (§6.1 step 2): the code challenge is base64url(sha256(verifier)),
# and the verifier/state must come from the OS CSPRNG — `getrandom` is that
# and nothing more, with no PRNG state to seed or reason about.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# One v4 UUID per MCP connection: the ai_context session id.
uuid = { workspace = true }

[dev-dependencies]
# Feature unification: these add the MCP *client* side (spawning the binary
# as a child process) for the e2e tests only.
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "transport-child-process"] }
tempfile = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
