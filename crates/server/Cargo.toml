[package]
name = "skardi-server"
version.workspace = true
edition.workspace = true
description = "Server for serving pre-defined pipelines"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[[bin]]
name = "skardi-server"
path = "src/main.rs"

[features]
# `chunking` is default: generated etl bundles (skardi-cloud) call
# chunk_parts at job run time, and the etl PRD's contract is that a
# STOCK server runs them — a feature-gated runtime function would fail
# the plain `cargo build -p skardi-server` / no-FEATURES Docker artifact
# at `chunk_parts`. The skardi LIBRARY keeps `default = []`; this is a
# server-artifact decision only (text-splitter is a small pure-Rust
# dep). Opt out with --no-default-features.
default = ["chunking"]
candle = ["skardi/candle"]
onnx = ["skardi/onnx"]
embedding = ["candle", "gguf", "onnx", "remote-embed"]
remote-embed = ["skardi/remote-embed"]
llm-extract = ["skardi/llm-extract"]
gguf = ["skardi/gguf"]
chunking = ["skardi/chunking"]
# RAG umbrella: chunk → embed → write loop in one feature.
rag = ["embedding", "chunking"]
# documents source connector (mirrors skardi/documents).
documents = ["skardi/documents"]
# rss source connector (mirrors skardi/rss). The typed `rss:` config block on
# `data_sources[]` parses without it; this flag is what makes a `type: rss`
# source register instead of failing with a build-capability error.
rss = ["skardi/rss"]

[dependencies]
better-auth = { workspace = true }
better-auth-diesel-sqlite = { workspace = true }
arrow = { workspace = true }
arrow-json = { workspace = true }
async-trait = "0.1"
axum = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
cookie = { workspace = true }
dirs = "5.0"
datafusion = { workspace = true }
datafusion-federation = { workspace = true }
datafusion-tracing = "52.0.0"
futures = { workspace = true }
lance = { workspace = true }
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
skardi = { path = "../skardi" }
anyhow = "1.0"
base64 = "0.22"
# The /mcp streamable-HTTP binding. default-features = false mirrors the
# CLI's pin; the transport feature brings rmcp's tower service (no runtime
# axum dependency — verified against the 3.1.4 source).
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-streamable-http-server"] }
skardi-mcp-core = { path = "../mcp-core" }
thiserror = "1.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-rusqlite = { workspace = true }
skardi-query-audit = { path = "../query-audit" }
# `util` is explicit: production code (the /mcp handler's self-dispatch)
# uses tower::ServiceExt::oneshot, which must not lean on the feature
# arriving transitively via axum/tower-http.
tower = { workspace = true, features = ["util"] }
# One v4 UUID per stateless MCP request: the audit-attribution fallback id.
uuid = { workspace = true }
tower-http = { workspace = true, features = ["fs", "trace", "cors"] }
tracing = { workspace = true }
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics"] }
opentelemetry-semantic-conventions = "0.27"
url = { workspace = true }

[dev-dependencies]
arrow = { workspace = true }
datafusion = { workspace = true }
http-body-util = "0.1"
# Client half of the /mcp end-to-end suite (tests/mcp_http.rs): a real rmcp
# client over HTTP against the served router. Same pin as the main
# dependency; features union in test builds.
rmcp = { version = "=3.1.4", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
# Raw HTTP probes for what the rmcp client can't express (an invented
# Mcp-Session-Id). Loopback plain-HTTP only, so no TLS backend.
reqwest = { version = "0.12", default-features = false }
skardi = { path = "../skardi" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
