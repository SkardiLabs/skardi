[package]
name = "skardi-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "skardi-server"
path = "src/main.rs"

[features]
default = []
onnx = ["skardi/onnx"]

[dependencies]
arrow = { workspace = true }
arrow-json = { workspace = true }
async-trait = "0.1"
axum = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
datafusion = { workspace = true }
datafusion-federation = { workspace = true }
datafusion-tracing = "52.0.0"
lance = { workspace = true }
object_store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
skardi = { path = "../skardi" }
anyhow = "1.0"
thiserror = "1.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["fs", "trace", "cors"] }
tracing = { workspace = true }
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics"] }
opentelemetry-semantic-conventions = "0.27"
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
