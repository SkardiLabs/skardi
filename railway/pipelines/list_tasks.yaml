kind: pipeline

metadata:
  name: "list-tasks"
  version: "1.0.0"
  description: "List all tasks for a user, optionally filtered by completion status."

# Parameters:
#   {user_id}  - User ID to filter tasks for
#   {done}     - Optional: 0 for open, 1 for completed (omit for all)

spec:
  query: |
    SELECT t.id, t.title, t.done, t.created_at
    FROM tasks t
    WHERE t.user_id = {user_id}
    ORDER BY t.created_at DESC
