kind: pipeline

metadata:
  name: "create-task"
  version: "1.0.0"
  description: "Create a new task for a user."

# Parameters:
#   {user_id} - Owner user ID
#   {title}   - Task title

spec:
  query: |
    INSERT INTO tasks (user_id, title, done, created_at)
    VALUES ({user_id}, {title}, 0, CAST(now() AS VARCHAR))
