kind: context

metadata:
  name: skardi-railway-template
  version: 1.0.0

spec:
  data_sources:
    - name: "tasks"
      type: "sqlite"
      access_mode: "read_write"
      path: "/data/backend.db"
      description: "Tasks table"
      options:
        table: "tasks"

    - name: "users"
      type: "sqlite"
      access_mode: "read_write"
      path: "/data/backend.db"
      description: "Users table"
      options:
        table: "users"
